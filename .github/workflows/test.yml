name: test

on:
  push:
  pull_request:
    paths-ignore:
      - "**/*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        haxe:
          - latest
          - 4.3.7
    steps:
      - uses: actions/checkout@v7
      - uses: krdlab/setup-haxe@v2.1.1
        with:
          haxe-version: ${{ matrix.haxe }}
      - name: Setup
        run: |
          haxelib dev sasl .
          haxelib install hxcpp
          haxelib install hxjava
          haxelib install hxnodejs
          haxelib git utest https://github.com/haxe-utest/utest
      - name: Run unit tests
        run: haxe test.hxml
      - name: Build api xml
        run: haxe doc.hxml
